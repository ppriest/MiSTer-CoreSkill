[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mister_mcp"
version = "0.1.0"
description = "MCP server over the mister-arcade-core scripts"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "websockets>=13"]

[project.scripts]
mister-mcp = "mister_mcp.server:main"

[tool.setuptools]
packages = ["mister_mcp"]
